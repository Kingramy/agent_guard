[project]
name = "agentguard"
version = "0.1.0"
description = "Enterprise AI Agent Reliability, Observability, and Pre-Deployment Security Testing Platform"
readme = "README.md"
authors = [
    { name = "Hamza HATTAB", email = "hhamzariadh@gmail.com" },
    { name = "Ramy" }
]
requires-python = ">=3.11"
dependencies = [
    "asyncpg>=0.31.0",
    "celery>=5.6.3",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "httpx>=0.28.1",
    "langchain-core>=1.6.5",
    "langgraph>=1.2.12",
    "opentelemetry-api>=1.45.0",
    "opentelemetry-sdk>=1.45.0",
    "psycopg2-binary>=2.9.13",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "redis>=8.1.0",
    "rich>=15.0.0",
    "sentence-transformers>=6.1.0",
    "sentencepiece>=0.2.2",
    "sqlalchemy>=2.1.1",
    "torch>=2.14.0",
    "transformers>=5.17.0",
    "typer>=0.27.2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
agentguard = "agentguard:main"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B"]
ignore = ["B008", "E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"

[tool.pyright]
extraPaths = ["benchmarks"]

